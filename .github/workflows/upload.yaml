name: Upload

permissions:
  contents: read

on:
  push:
    branches:
      - main
  pull_request: {}

concurrency:
  group: cos-upload-${{ github.repository }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'production' }}
  queue: max
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v7.0.1
      with:
        persist-credentials: false

    - uses: actions/setup-node@v6.5.0
      with:
        node-version: 24

    - name: Enable Corepack
      run: |
        corepack enable
        corepack prepare yarn@4.18.0 --activate
        yarn --version

    - uses: calcit-lang/setup-calcit@v1.5.0
      with:
        tools: calcit,caps
        deps-file: deps.cirru
        caps-version: "0.1.1"

    - name: Validate Calcit snapshot and types
      run: |
        set -euo pipefail
        caps --strict --ci
        yarn install --immutable
        caps deps.cirru verify --toolchain
        calcit calcit.cirru edit format
        git diff --quiet --exit-code -- calcit.cirru
        calcit calcit.cirru --check-only --all-defs
        calcit calcit.cirru fix --workflow strict --verify --format json | jq -e '.data.workflow.status == "passed" and .diagnostics == []'
        calcit calcit.cirru test --exclude-tag js-only --require-match --summary-only --format json
        calcit calcit.cirru --check-only --ns reel.core --ns reel.schema --ns reel.typed --ns reel.typed-compat --ns reel.util --summary-only
        calcit calcit.cirru analyze weak-types --only coverage --summary-only --format json
        calcit calcit.cirru analyze weak-types --only schema-dynamic,code-dynamic --intent unresolved --summary-only --format json
        calcit calcit.cirru analyze weak-types --only deprecated-call --summary-only --format json | jq -e '.data.summary.calls == 0'

    - name: Verify typed Reel native and JS behavior
      run: |
        set -euo pipefail
        calcit test reel.typed --require-match
        calcit test reel.typed-compat --require-match
        calcit --entry test --check-only
        calcit --entry test
        calcit --init-fn reel.test-typed/main! --reload-fn reel.comp.reel/comp-typed-reel --emit-path test-js-out js
        yarn node tests/typed-reel.mjs

    - name: Check out an independent typed Reel consumer
      uses: actions/checkout@v7.0.1
      with:
        repository: calcit-lang/respo-calcit-workflow
        ref: 34db518c93a097600d5890100ed13db80be02fc6
        path: .calcit/workflow-consumer
        persist-credentials: false

    - name: Check original workflow source against this Reel
      working-directory: .calcit/workflow-consumer
      run: |
        set -euo pipefail
        # Source compatibility fixture, not the consumer's own npm/deployment graph.
        git rev-parse HEAD
        cp "$GITHUB_WORKSPACE/deps.cirru" "$GITHUB_WORKSPACE/package.json" "$GITHUB_WORKSPACE/yarn.lock" .
        # Reel no longer depends on respo-ui, but this consumer's own source still loads it.
        sed -i 's#:dependencies \$ {} #:dependencies $ {} (|Respo/respo-ui.calcit |0.9.0) #' deps.cirru
        grep -q 'Respo/respo-ui.calcit' deps.cirru
        ln -s "$GITHUB_WORKSPACE/node_modules" node_modules
        caps --strict --ci
        ln -s "$GITHUB_WORKSPACE" .calcit/modules/reel.calcit
        calcit --check-only --all-defs
        calcit fix --workflow strict --verify --format json | jq -e 'if .data.workflow.status == "passed" and .diagnostics == [] then true else ., false end'
        calcit test --require-match --summary-only --format json
        calcit js
        yarn vite build --base=./
        git diff --quiet -- . ':!deps.cirru' ':!package.json' ':!yarn.lock'

    - name: Select CDN asset prefix
      id: asset-path
      if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
      env:
        PR_NUMBER: ${{ github.event.pull_request.number }}
      run: |
        set -euo pipefail
        if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
          asset_prefix="${GITHUB_REPOSITORY}/pr/${PR_NUMBER}/${GITHUB_RUN_ID}/${GITHUB_RUN_ATTEMPT}/"
        elif [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
          asset_prefix="${GITHUB_REPOSITORY}/"
        else
          asset_prefix="${GITHUB_REPOSITORY}/branches/${GITHUB_REF_NAME}/"
        fi
        base_url="https://cos-sh.tiye.me/${asset_prefix}"
        echo "prefix=${asset_prefix}" >> "$GITHUB_OUTPUT"
        echo "base-url=${base_url}" >> "$GITHUB_OUTPUT"
        echo "VITE_BASE_URL=${base_url}" >> "$GITHUB_ENV"

    - name: Build demo
      run: |
        set -euo pipefail
        calcit calcit.cirru js
        yarn vite build

    - name: Upload static assets to COS
      if: steps.asset-path.outcome == 'success'
      timeout-minutes: 10
      uses: worktools/cos-upload-action@v1.2.0
      with:
        source-dir: dist
        bucket: ${{ secrets.COS_BUCKET }}
        region: ap-shanghai
        prefix: ${{ steps.asset-path.outputs.prefix }}
        secret-id: ${{ secrets.COS_SECRET_ID }}
        secret-key: ${{ secrets.COS_SECRET_KEY }}
        public-base-url: ${{ steps.asset-path.outputs.base-url }}

    - name: Deploy to server
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      id: deploy
      uses: Pendect/action-rsyncer@v2.0.0
      env:
        DEPLOY_KEY: ${{secrets.rsync_private_key}}
      with:
        flags: '-avzr --progress'
        options: ''
        ssh_options: ''
        src: 'dist/*'
        dest: 'rsync-user@tiye.me:/web-assets/repo/${{ github.repository }}'

    - name: Display status from deploy
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      run: echo "${{ steps.deploy.outputs.status }}"
